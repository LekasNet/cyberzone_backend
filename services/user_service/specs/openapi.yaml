openapi: 3.0.3
info:
  title: Cyberzone User Service
  version: 0.1.0
servers:
  - url: http://localhost:8081
paths:
  /health:
    get:
      responses:
        "200":
          description: OK
  /users/me:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
    put:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string, nullable: true }
                lastName: { type: string, nullable: true }
                nickname: { type: string, nullable: true }
                phone: { type: string, nullable: true }
                institute: { type: string, nullable: true }
                group: { type: string, nullable: true }
                avatarUrl: { type: string, nullable: true }
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid input
  /users/me/roles:
    get:
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
    put:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: OK }
        "400": { description: Invalid role ids }
  /users/me/disciplines:
    get:
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
    put:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disciplineIds]
              properties:
                disciplineIds:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: OK }
        "400": { description: Invalid discipline ids }
  /users/{id}:
    get:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not found }
  /dictionaries/roles:
    get:
      responses:
        "200": { description: OK }
  /dictionaries/disciplines:
    get:
      responses:
        "200": { description: OK }
  /admin/users:
    get:
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: roleId
          schema: { type: string }
        - in: query
          name: disciplineId
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: minRating
          schema: { type: number }
      responses:
        "200": { description: OK }
        "403": { description: Forbidden }
  /admin/users/{id}:
    get:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not found }
  /admin/users/{id}/make_admin:
    put:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "403": { description: Forbidden }
  /admin/users/{id}/remove_admin:
    put:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "403": { description: Forbidden }
  /admin/users/{id}/ban:
    put:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "403": { description: Forbidden }
  /admin/users/{id}/unban:
    put:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "403": { description: Forbidden }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
