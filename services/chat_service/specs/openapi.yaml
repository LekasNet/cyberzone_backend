openapi: 3.0.3
info:
  title: Cyberzone Chat Service
  version: 0.1.0
servers:
  - url: http://localhost:8085
paths:
  /health:
    get:
      responses:
        "200": { description: OK }
  /chats:
    post:
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId: { type: string }
      responses:
        "201": { description: Created }
        "200": { description: Exists }
  /chats/permanent:
    get:
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }
    post:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
      responses:
        "201": { description: Created }
        "403": { description: Forbidden }
  /chats/{id}/activate:
    put:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /chats/{id}/deactivate:
    put:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /events/{eventId}/chat:
    get:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /chats/{chatId}/messages:
    get:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: chatId
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "403": { description: Forbidden }
        "404": { description: Not found }
    post:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: chatId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "201": { description: Created }
        "403": { description: Forbidden }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
